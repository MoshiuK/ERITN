<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Not Available - Maintenance</title>
  <style>
    body {
      font: 14px 'Segoe UI', 'Helvetica Neue', 'Futura', arial, sans-serif;
      font-weight: normal;
      margin: 0;
      padding: 0;
      background-color: whitesmoke;
      color: black;
    }

    #splashimage {
      margin: 0 auto;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    #message-container {
      position: absolute;
      top: 15%;
      left: 0;
      margin-left: 10%;
      margin-right: 10%;
    }

    h1 {
      font-size: 108px;
      margin: 0;
      padding-bottom: 40px;
    }

    h2 {
      font-size: 48px;
      font-weight: bold;
      margin: 0;
      padding: 0;
    }

    h3 {
      font-size: 18px;
    }

    p {
      margin: 8px 0;
      padding: 0;
    }

    a {
      color: black;
    }

    .message p {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="message-container">
    <h1>:^(</h1>
    <h2>UNAVAILABLE</h2>

    <div class="message">
      <h3>We are temporarily unavailable, please check back later.</h3>
      <p>
        The site is currently down for maintenence. Our team is working hard to get things up and running again as quickly as possible. Thank you for your patience.
      </p>
      <p>
        We apologize for the inconvenience.
      </p>
    </div>
  </div>
</body>
</html>
